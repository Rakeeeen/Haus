<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Haus</title>
    <!-- The two fonts the system uses (General Sans, Geist Mono). Linked here, not @imported from the CSS, so they download
         beside the page's own files instead of after them; the Arabic font (Thmanyah) loads from global.css only when Arabic is on screen. -->
    <link rel="preconnect" href="https://api.fontshare.com">
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@200,300,400,500,600,700,900&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@100..900&display=swap">
  </head>
  <body>
    <div id="root"></div>
    <!-- GitHub Pages lets a browser keep an old copy of this page for ten minutes, and every deploy replaces the
         hashed files that copy points to. If one of our own files is gone, load the page again (once a minute at
         most) to get the new one, instead of leaving a blank screen. -->
    <script>
      (function () {
        function reloadOnce() {
          try {
            var last = Number(sessionStorage.getItem('haus_reloaded_at') || 0);
            if (Date.now() - last < 60000) return;
            sessionStorage.setItem('haus_reloaded_at', String(Date.now()));
          } catch (e) {}
          location.reload();
        }
        window.addEventListener('error', function (e) {
          var t = e.target;
          var url = t && (t.src || t.href);
          if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK') && typeof url === 'string' && url.indexOf(location.origin) === 0) reloadOnce();
        }, true);
        window.addEventListener('vite:preloadError', reloadOnce);
      })();
    </script>
    <script type="module" src="./src/app/main.tsx"></script>
  </body>
</html>
