<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Haus</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,100..900;1,100..900&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <!-- GitHub Pages lets a browser keep an old copy of this page for ten minutes, and every deploy replaces the
         hashed files that copy points to. If one of our own files is gone, load the page again (once a minute at
         most) to get the new one, instead of leaving a blank screen. -->
    <script>
      (function () {
        function reloadOnce() {
          try {
            var last = Number(sessionStorage.getItem('haus_reloaded_at') || 0);
            if (Date.now() - last < 60000) return;
            sessionStorage.setItem('haus_reloaded_at', String(Date.now()));
          } catch (e) {}
          location.reload();
        }
        window.addEventListener('error', function (e) {
          var t = e.target;
          var url = t && (t.src || t.href);
          if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK') && typeof url === 'string' && url.indexOf(location.origin) === 0) reloadOnce();
        }, true);
        window.addEventListener('vite:preloadError', reloadOnce);
      })();
    </script>
    <script type="module" src="./src/app/main.tsx"></script>
  </body>
</html>
